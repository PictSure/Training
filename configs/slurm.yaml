training_loc: "cluster"

name: test

paths:
  output: /netscratch/schiesser/embed_then_cat/runs/
  dataset: /netscratch/schiesser/inet/
  train: imagenet21k-train.msgpack
  test: imagenet21k-test.msgpack

resnet: 18

model:
  nheads: 4
  nlayers: 8

optimizer:
  lr: 0.001
  lr_initial: 5e-4 # lr_max
  lr_target: 5e-5 # lr_min
  epochs: 10
  weight_decay: 0.00001
  log_step: 500
  epsilon: 0.1
  acc_steps: 1

dataloader:
  num_samples: 10000
  batch_size: 16
  num_classes: 10
  num_images: 10
  train_ratio: 0.01
  test_ratio: 1
  num_workers: 8