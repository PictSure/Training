training_loc: cluster

name: m

resnet: 34

paths:
  output: /netscratch/schiesser/embed_then_cat/runs/
  dataset: /netscratch/schiesser/inet2/
  train: imagenet21k-train.msgpack
  test: imagenet21k-test.msgpack

model:
  nheads: 8
  nlayers: 6

optimizer:
  lr_initial: 0.000001
  lr_target: 0.0000001
  lr: 0.0001
  epochs: 1200
  weight_decay: 0.00001
  log_step: 10
  epsilon: 0.1
  acc_steps: 1

dataloader:
  num_samples: 10000
  batch_size: 16
  num_classes: 25
  num_images: 5
  train_ratio: 0.01
  test_ratio: 1
  num_workers: 16