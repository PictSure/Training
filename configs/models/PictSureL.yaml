training_loc: "cluster"

name: l

resnet: 50

paths:
  output: /netscratch/schiesser/embed_then_cat/runs/
  dataset: /netscratch/schiesser/inet/
  train: imagenet21k-train.msgpack
  test: imagenet21k-test.msgpack

model:
  nheads: 17
  nlayers: 8

optimizer:
  lr_initial: 1e-6
  lr_target: 1e-7
  lr: 1e-4
  epochs: 2400
  weight_decay: 1e-5
  log_step: 10
  epsilon: 0.1
  acc_steps: 1

dataloader:
  num_samples: 10000
  batch_size: 16
  num_classes: 50
  num_images: 5
  train_ratio: 0.02
  test_ratio: 1
