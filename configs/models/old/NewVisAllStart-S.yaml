training_loc: cluster

name: VisAllStart


visnet:

paths:
  output: /netscratch/schiesser/embed_then_cat/runs/
  dataset: /netscratch/schiesser/inet/
  train: imagenet21k-train.msgpack
  test: imagenet21k-test.msgpack
  visnet_weights: 

model:
  nheads: 8
  nlayers: 4

optimizer:
  epochs: 600
  weight_decay: 1e-5
  log_step: 10
  epsilon: 0.1
  acc_steps: 1
  all: true
  from_start: true
  lr_encoder: 5e-5
  lr_rest: 5e-5
  lr_schedule: true
  lr_initial: 5e-4
  lr_target: 5e-5


dataloader:
  num_samples: 10000
  batch_size: 10
  num_classes: 10
  num_images: 5
  train_ratio: 0.01
  test_ratio: 1
  num_workers: 8

resample: 10