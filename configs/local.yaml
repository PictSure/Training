training_loc: "local"

resnet: 18

name: test

paths:
  output: output/
  dataset: /Volumes/DFKI117/
  train: imagenet21k-train.msgpack
  test: imagenet21k-test.msgpack

model:
  nheads: 4
  nlayers: 8

optimizer:
  lr_initial: 0.000001
  lr_target: 0.0000001
  lr: 0.001
  epochs: 1
  weight_decay: 0.00001
  log_step: 500
  epsilon: 0.1
  acc_steps: 8

dataloader:
  num_samples: 10000
  batch_size: 16
  num_classes: 5
  num_images: 10
  train_ratio: 0.01
  test_ratio: 1
  num_workers: 0